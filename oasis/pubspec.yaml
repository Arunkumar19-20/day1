name: oasis
description: "OASIS - One Health Surveillance & Intelligence System (Human + Animal + Environmental)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Icons ---
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1

  # --- State Management ---
  provider: ^6.1.2
  get_it: ^8.0.0

  # --- Networking & API ---
  http: ^1.2.2
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # --- Local Storage / Offline Sync ---
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  sqflite: ^2.4.0
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.22

  # --- Maps & Geolocation ---
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^4.0.0

  # --- Media & Attachments ---
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  camera: ^0.11.0+2
  flutter_sound: ^9.28.0
  permission_handler: ^11.3.1

  # --- QR / Barcode ---
  qr_flutter: ^4.1.0
  barcode_scan2: ^4.3.0

  # --- Charts & Analytics ---
  syncfusion_flutter_charts: ^27.1.54
  fl_chart: ^0.69.0
  firebase_analytics: ^11.2.1

  # --- Notifications & Alerts ---
  flutter_local_notifications: ^18.0.1
  awesome_notifications: ^0.10.1   # ✅ fixed version per Flutter 3.8

  # --- Authentication & Cloud Sync (Firebase Optional) ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.4.2
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.2.1

  # --- JSON & Models ---
  json_annotation: ^4.9.0

  # --- Background Tasks / Sync ---
  workmanager: ^0.9.0+3

  # --- Internationalization / Localization ---
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # --- URL & Sharing ---
  url_launcher: ^6.3.0
  share_plus: ^10.1.1

  # --- ML & Voice / ASR ---
  tflite_flutter: ^0.11.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # --- Logging & Telemetry ---
  logger: ^2.3.0
  sentry_flutter: ^8.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.9.2

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/json/
    - assets/sounds/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
